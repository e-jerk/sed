name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          echo "APP_ID set: ${{ vars.APP_ID != '' }}"
          echo "PRIVATE_KEY set: ${{ secrets.PRIVATE_KEY != '' }}"
          echo "PRIVATE_KEY length: $(echo -n '${{ secrets.PRIVATE_KEY }}' | wc -c)"
          echo "PRIVATE_KEY first 30: $(echo '${{ secrets.PRIVATE_KEY }}' | head -c 30)"
